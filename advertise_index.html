<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10182e"><title>ゲート・ブラスター</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1223;color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100svh;display:grid;place-items:center;padding:14px}main{width:min(100%,530px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}h1{font-size:clamp(19px,5vw,27px);margin:0;letter-spacing:.03em}header small{color:#a8bad4;font-size:12px}.badge{border-radius:12px;background:#263753;padding:7px 11px;color:#cfe7fd;font-size:13px;font-weight:800}.wrap{position:relative;border-radius:20px;overflow:hidden;background:#1b3350;border:1px solid #59738b;box-shadow:0 18px 50px #0008;touch-action:none}canvas{display:block;width:100%;height:auto;aspect-ratio:480/700;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:#0b1528df;backdrop-filter:blur(5px)}.overlay[hidden]{display:none}.panel{max-width:350px}.panel h2{font-size:clamp(26px,7vw,36px);line-height:1.25;margin:8px 0 14px}.panel p{font-size:15px;color:#d0ddec;line-height:1.8}.panel .big{font-size:47px}.start{border:0;background:#6bf0c9;color:#103f3d;font:inherit;font-size:17px;font-weight:900;border-radius:13px;padding:15px 30px;cursor:pointer;box-shadow:0 5px 0 #279d85}.start:active{transform:translateY(3px);box-shadow:0 2px 0 #279d85}.legend{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}.legend span{font-size:12px;border-radius:9px;padding:8px;background:#1c2c46;color:#cbd9ec}.hint{font-size:13px;color:#afc0d7;line-height:1.7;text-align:center;margin:12px 0}.touchbuttons{display:flex;justify-content:center;gap:12px}.touchbuttons button{font:inherit;color:white;background:#273b59;border:1px solid #55718a;border-radius:13px;padding:11px 32px;font-size:19px;touch-action:none;cursor:pointer}button:focus-visible{outline:3px solid #ffe483;outline-offset:2px}</style></head><body><main><header><div><h1>GATE BLASTER</h1><small>ゲート・ブラスター</small></div><span class="badge" id="level">WAVE 1</span></header><div class="wrap" id="wrap"><canvas id="game" width="480" height="700" aria-label="自動で弾を撃ち、左右に移動して敵を倒すゲーム"></canvas><div class="overlay" id="overlay"><div class="panel"><div class="big" id="icon">🎯</div><h2 id="title">撃って、増やして、<br>敵をたおせ！</h2><p id="desc">左右に動いて敵をねらおう。<br>弾をゲートに当てると、<br>数が増えたり、銃が強くなったり！</p><button class="start" id="start">ゲームスタート</button></div></div></div><div class="legend"><span>🟦 ×2 弾が2つに分かれる</span><span>🟨 HIT 銃の威力アップ</span><span>❤️ 敵を通すとライフ減少</span></div><p class="hint">指・マウスで左右に動かす / キーボードの ← → でも操作できます<br>銃は自動で発射します</p><div class="touchbuttons"><button id="left" aria-label="左に移動">◀</button><button id="right" aria-label="右に移動">▶</button></div></main><script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),start=document.querySelector('#start'),wrap=document.querySelector('#wrap'),badge=document.querySelector('#level');const W=480,H=700;let game='ready',playerX=240,targetX=240,shots=[],enemies=[],gates=[],particles=[],wave=1,lives=5,power=1,kills=0,timer=0,spawnTimer=0,spawned=0,spawnTotal=0,shotTimer=0,last=0,between=0,keys={};
function addWave(n){spawned=0;spawnTotal=Math.min(7+n*3,34);spawnTimer=.55;between=0;badge.textContent=`WAVE ${n}`;gates=[{id:1,x:30,y:400,w:190,h:72,type:'multi',active:true},{id:2,x:260,y:400,w:190,h:72,type:'upgrade',need:Math.min(10+Math.floor(n/2)*2,20),hits:0,active:true}];if(n%2===0){gates[0].x=260;gates[1].x=30} }
function init(){game='play';playerX=targetX=240;shots=[];enemies=[];particles=[];wave=1;lives=5;power=1;kills=0;timer=0;shotTimer=0;addWave(wave);overlay.hidden=true}
function spawnEnemy(){let hp=3+Math.floor(wave*1.6)+Math.floor(Math.random()*Math.max(2,wave));let lane=Math.floor(Math.random()*6);enemies.push({x:55+lane*74,y:-30,hp,max:hp,speed:26+Math.min(wave*3,30)+Math.random()*12,r:20})}
function shoot(){if(shots.length>=200)return;shots.push({x:playerX,y:603,vx:0,damage:power,seen:0});}
function puff(x,y,color,count=6){for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,life:.25+Math.random()*.2,color})}
function finish(){game='over';document.querySelector('#icon').textContent='💥';document.querySelector('#title').textContent='ゲームオーバー';document.querySelector('#desc').innerHTML=`WAVE ${wave} まで到達！<br>たおした敵：${kills}体 ／ 銃の威力：${power}<br>ゲートを上手に使って、もう一度挑戦！`;start.textContent='もう一度あそぶ';overlay.hidden=false}
function update(dt){timer+=dt;if(keys.left)targetX-=320*dt;if(keys.right)targetX+=320*dt;targetX=Math.max(26,Math.min(W-26,targetX));playerX+=(targetX-playerX)*Math.min(1,dt*16);shotTimer-=dt;if(shotTimer<=0){shoot();shotTimer=.22}spawnTimer-=dt;if(spawned<spawnTotal&&spawnTimer<=0){spawnEnemy();spawned++;spawnTimer=Math.max(.4,1.1-wave*.045)}
for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.y-=350*dt;s.x+=s.vx*dt;let removed=false;for(const g of gates){if(g.active&&!(s.seen&g.id)&&s.y<=g.y+g.h&&s.y>=g.y-12&&s.x>=g.x&&s.x<=g.x+g.w){s.seen|=g.id;if(g.type==='multi'){s.vx=-30;if(shots.length<200)shots.push({x:s.x+5,y:s.y,vx:30,damage:s.damage,seen:s.seen});puff(s.x,s.y,'#79c7ff',2)}else{g.hits++;puff(s.x,s.y,'#ffdf74',2);if(g.hits>=g.need){g.active=false;power++;puff(g.x+g.w/2,g.y+g.h/2,'#ffe88f',16)}}}}for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(Math.abs(s.x-e.x)<e.r+5&&Math.abs(s.y-e.y)<e.r+7){e.hp-=s.damage;puff(s.x,s.y,'#fff0ab',3);shots.splice(i,1);removed=true;if(e.hp<=0){puff(e.x,e.y,'#ff9e91',10);enemies.splice(j,1);kills++}break}}if(!removed&&(s.y<-20||s.x<-20||s.x>W+20))shots.splice(i,1)}
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.y+=e.speed*dt;if(e.y>610){enemies.splice(i,1);lives--;puff(e.x,610,'#ff7386',12);if(lives<=0){finish();return}}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}if(spawned>=spawnTotal&&enemies.length===0){between+=dt;if(between>1.5){wave++;addWave(wave)}}}
function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function draw(){ctx.fillStyle='#1b3350';ctx.fillRect(0,0,W,H);ctx.fillStyle='#253f5c';ctx.fillRect(18,0,W-36,H);ctx.strokeStyle='#ffffff12';ctx.lineWidth=2;for(let x=95;x<W;x+=96){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.setLineDash([15,17]);ctx.strokeStyle='#ffffff19';ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff8b9a55';ctx.fillRect(18,610,W-36,4);
for(const g of gates){let color=g.type==='multi'?'#368fe5a8':'#b68a28bf';round(g.x,g.y,g.w,g.h,12,g.active?color:'#414e5c77');ctx.strokeStyle=g.active?(g.type==='multi'?'#9bdeff':'#ffeaa6'):'#8895a0';ctx.lineWidth=2;ctx.stroke();ctx.textAlign='center';ctx.fillStyle='white';ctx.font='900 27px system-ui';ctx.fillText(g.type==='multi'?'× 2':g.active?'POWER UP':'POWER UP ✓',g.x+g.w/2,g.y+32);ctx.font='bold 13px system-ui';ctx.fillText(g.type==='multi'?'弾が2つに分かれる':g.active?`あと ${g.need-g.hits} HIT`:'強化完了！',g.x+g.w/2,g.y+54)}
for(const s of shots){round(s.x-3,s.y-11,6,17,3,'#fff3a4')}for(const e of enemies){round(e.x-20,e.y-20,40,40,12,'#f06a72');round(e.x-14,e.y-12,9,9,3,'#ffe4d8');round(e.x+5,e.y-12,9,9,3,'#ffe4d8');round(e.x-22,e.y-31,44,5,3,'#221c35');round(e.x-22,e.y-31,44*Math.max(0,e.hp/e.max),5,3,'#80edb0');ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillText(Math.max(0,e.hp),e.x,e.y+15)}for(const p of particles){ctx.fillStyle=p.color;ctx.globalAlpha=Math.min(1,p.life*3);ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill()}ctx.globalAlpha=1;round(playerX-20,600,40,44,12,'#76e8d1');round(playerX-6,586,12,29,5,'#c8fff3');round(playerX-13,615,26,14,6,'#176a71');round(20,14,155,40,12,'#101b30d9');ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.textAlign='left';ctx.fillText('❤️ '+lives+'   ⚡ '+power,31,40);round(315,14,145,40,12,'#101b30d9');ctx.textAlign='right';ctx.fillText('撃破 '+kills,448,40);if(game==='play'&&spawned>=spawnTotal&&enemies.length===0){ctx.textAlign='center';ctx.fillStyle='#fff6b4';ctx.font='900 27px system-ui';ctx.fillText('WAVE CLEAR!',W/2,260)}}
function loop(now){if(!last)last=now;let dt=Math.min((now-last)/1000,.04);last=now;if(game==='play')update(dt);draw();requestAnimationFrame(loop)}start.addEventListener('click',init);function point(e){let rect=canvas.getBoundingClientRect();targetX=(e.clientX-rect.left)*W/rect.width}wrap.addEventListener('pointerdown',e=>{if(game==='play'){point(e);wrap.setPointerCapture(e.pointerId)}});wrap.addEventListener('pointermove',e=>{if(game==='play'&&(e.buttons||e.pointerType==='touch'))point(e)});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){keys[e.key==='ArrowLeft'?'left':'right']=true;e.preventDefault()}});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});window.addEventListener('blur',()=>keys={});for(const dir of ['left','right']){let b=document.getElementById(dir);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[dir]=true;b.setPointerCapture(e.pointerId)});for(const type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,()=>keys[dir]=false)}requestAnimationFrame(loop);
</script></body></html>
