<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#261a46"><title>コンカフェ性格診断</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 15%,#9e699b 0,transparent 35%),radial-gradient(circle at 85% 80%,#5d7fa9 0,transparent 35%),#251b42;color:#292039;font-family:system-ui,-apple-system,sans-serif}main{width:min(100%,620px)}header{color:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 4px 22px}header strong{font-size:19px}header span{font-size:13px;color:#efddf4}.card{background:#fffafd;border-radius:28px;padding:clamp(25px,7vw,46px);box-shadow:0 20px 60px #100a3080}.label{font-size:13px;letter-spacing:.13em;font-weight:800;color:#ac5d99}.emoji{font-size:54px;margin:12px 0}h1{font-size:clamp(30px,7vw,42px);line-height:1.4;margin:10px 0 16px}h2{font-size:clamp(23px,5vw,30px);line-height:1.55;margin:18px 0 24px}p{color:#6b5f70;line-height:1.9}.primary{border:0;background:#ae5c97;color:white;font-size:16px;font-weight:800;padding:16px 24px;border-radius:14px;cursor:pointer;box-shadow:0 4px 0 #803c70}.primary:active{transform:translateY(2px)}button:focus-visible{outline:3px solid #d08a37;outline-offset:3px}.choices{display:grid;gap:11px}.choice{background:#fff;border:2px solid #f0dfea;border-radius:14px;text-align:left;padding:16px;font-size:16px;line-height:1.5;color:#3d3047;font-weight:700;cursor:pointer}.choice:hover{border-color:#d58abf;background:#fff3fa}.progress{height:7px;background:#f1e3ed;border-radius:8px;margin:14px 0 27px;overflow:hidden}.bar{height:100%;background:#ce7db4;transition:width .2s}.meta{display:flex;justify-content:space-between;color:#9a6e91;font-size:14px;font-weight:700}.result-icon{font-size:55px}.type{font-size:clamp(30px,7vw,39px);color:#a64e8e;margin:8px 0}.tags{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.tag{background:#f6e6f1;color:#9c548b;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700}.tip{background:#f8eff8;border-radius:16px;padding:14px 18px;margin:20px 0}.tip strong{color:#a64e8e}.tip p{margin:5px 0}.note{font-size:13px;color:#8c7c8d}.actions{display:flex;gap:10px;flex-wrap:wrap}.secondary{border:1px solid #e7cfe0;background:white;color:#9c548b;border-radius:14px;padding:15px 20px;font-size:16px;font-weight:700;cursor:pointer}footer{text-align:center;color:#eadbea;font-size:13px;line-height:1.7;margin:18px} [hidden]{display:none!important}</style></head><body><main><header><strong>✦ コンカフェ性格診断</strong><span>6つの質問でわかる</span></header><section id="intro" class="card"><div class="label">YOUR CONCAFE STYLE</div><div class="emoji">🎀 ☕ ✨</div><h1>あなたはどんな<br>コンカフェタイプ？</h1><p>もしもコンカフェに行くなら？<br>気になる選択肢を選んで、あなたらしい楽しみ方を見つけよう。</p><button class="primary" id="start">診断をはじめる</button><p class="note">全6問・約1分・登録なし</p></section><section id="quiz" class="card" hidden><div class="meta"><span id="number"></span><span>直感で選んでね</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="label">QUESTION</div><h2 id="question"></h2><div class="choices" id="choices"></div><button class="secondary" id="back" style="margin-top:20px">ひとつ戻る</button></section><section id="result" class="card" hidden><div class="label">YOUR RESULT</div><div class="result-icon" id="icon"></div><p style="margin-bottom:0">あなたのタイプは…</p><h1 class="type" id="type"></h1><p id="desc"></p><div class="tags" id="tags"></div><div class="tip"><strong>おすすめの楽しみ方</strong><p id="tip"></p></div><p class="note">この診断はエンターテインメントです。結果にとらわれず、好きな楽しみ方を見つけてね。</p><div class="actions"><button class="primary" id="retry">もう一度診断する</button><button class="secondary" id="copy">結果をコピー</button></div><p class="note" id="copy-message" role="status"></p></section><footer>自分らしい「好き」を見つけよう ♡<br>回答は送信・保存されません</footer></main><script>
const questions=[
{q:'休日に出かけるなら、どんな場所が気になる？',a:[['個性的な世界観にひたれる場所',0],['みんなで盛り上がれる場所',1],['落ち着いておしゃべりできる場所',2],['まだ知らないものに出会える場所',3]]},
{q:'お店のメニュー、最初に目がいくのは？',a:[['テーマにぴったりの特別な一品',0],['見た目が楽しい、みんなで盛り上がる一品',1],['ほっとできるお気に入りの飲み物',2],['名前から味を想像できない一品',3]]},
{q:'初めて訪れたお店では、どう過ごしたい？',a:[['内装や衣装をじっくり楽しみたい',0],['会話やイベントを思いきり楽しみたい',1],['自分のペースでゆったりしたい',2],['おすすめを聞いて新しい体験をしたい',3]]},
{q:'友だちと写真を撮るなら、どんな一枚が好き？',a:[['小物や背景にこだわった一枚',0],['みんなの笑顔いっぱいの一枚',1],['自然体でくつろいだ一枚',2],['その場のひらめきで撮った一枚',3]]},
{q:'推しに伝えるなら、どんな言葉がしっくりくる？',a:[['その世界観、本当に素敵！',0],['いつも元気をありがとう！',1],['一緒にいると落ち着くね',2],['次はどんなことに挑戦するの？',3]]},
{q:'また行きたい！と思うのは、どんなとき？',a:[['物語の中に入ったような気分になれた',0],['笑って楽しい思い出ができた',1],['自分らしくリラックスできた',2],['予想外の発見があった',3]]}];
const types=[{icon:'🌙',name:'世界観ひたりタイプ',desc:'雰囲気や細かな演出に心がときめくあなた。ひとつひとつのこだわりを見つけて、自分なりの物語を楽しむのが得意かも。',tags:['ロマンチック','こだわり派','想像力'],tip:'テーマの気になるお店で、内装や衣装、限定メニューをじっくり楽しんでみて。'},{icon:'🎉',name:'わいわい盛り上げタイプ',desc:'楽しい空気が大好きなあなた。会話やイベントを通じて、その場のわくわくをみんなと分かち合うのが得意かも。',tags:['にぎやか','ポジティブ','思い出づくり'],tip:'イベントのある日をチェックして、友だちと一緒に訪れてみるのも楽しそう。'},{icon:'☕',name:'まったり癒やしタイプ',desc:'心地よい時間を大切にするあなた。落ち着ける空間で、ゆっくり会話したり、お気に入りを見つけたりするのが好きかも。',tags:['マイペース','聞き上手','癒やし'],tip:'静かに過ごせそうな時間帯に、好きなドリンクと一緒にゆったり楽しんでみて。'},{icon:'🔮',name:'ときめき探検タイプ',desc:'初めてのものに好奇心が動くあなた。知らなかった世界に飛び込んで、新しいお気に入りを見つけるのが得意かも。',tags:['好奇心','チャレンジ','発見'],tip:'気になるコンセプトを調べて、いつもと違う雰囲気のお店にも挑戦してみて。'}];
const $=s=>document.querySelector(s);let pos=0,answers=[];function render(){let q=questions[pos];$('#number').textContent=`${pos+1} / ${questions.length}`;$('#bar').style.width=`${pos/questions.length*100}%`;$('#question').textContent=q.q;$('#back').hidden=pos===0;$('#choices').replaceChildren();q.a.forEach(([label,value])=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.addEventListener('click',()=>{answers[pos]=value;pos++;if(pos===questions.length)showResult();else render()});$('#choices').append(b)})}function begin(){pos=0;answers=[];$('#intro').hidden=true;$('#result').hidden=true;$('#quiz').hidden=false;render()}function showResult(){let scores=[0,0,0,0];answers.forEach(v=>scores[v]++);let max=Math.max(...scores),winners=scores.map((n,i)=>n===max?i:-1).filter(i=>i>=0);let chosen=answers.find(v=>winners.includes(v)),t=types[chosen];$('#quiz').hidden=true;$('#result').hidden=false;$('#icon').textContent=t.icon;$('#type').textContent=t.name;$('#desc').textContent=t.desc;$('#tip').textContent=t.tip;$('#tags').replaceChildren(...t.tags.map(x=>{let el=document.createElement('span');el.className='tag';el.textContent=x;return el}));$('#copy-message').textContent=''}$('#start').addEventListener('click',begin);$('#retry').addEventListener('click',begin);$('#back').addEventListener('click',()=>{if(pos>0){pos--;render()}});$('#copy').addEventListener('click',async()=>{let text=`コンカフェ性格診断の結果は「${$('#type').textContent}」でした！`;try{await navigator.clipboard.writeText(text);$('#copy-message').textContent='結果をコピーしました！'}catch(e){$('#copy-message').textContent=text+'（長押しまたは選択してコピーできます）'}});
</script></body></html>
